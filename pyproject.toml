[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robofang"
version = "1.8.0a2"
description = "RoboFang MCP & robotics orchestration hub"
requires-python = ">=3.11"
dependencies = [
    # Core runtime
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "aiohttp>=3.9",
    "websockets>=12",
    "psutil>=5.9",
    "pydantic>=2.7",
    "typer>=0.12.0",
    "rich>=13.7.1",

    # ── Comms connectors ────────────────────────────────────────────────────
    "discord.py>=2.3",         # DiscordConnector
    "slack-sdk>=3.27",         # SlackConnector (optional: pip install slack-sdk)

    # ── Physical device connectors ──────────────────────────────────────────
    "python-kasa>=0.7",        # TapoConnector  (smart plugs / cameras)
    "phue>=1.1",               # HueConnector   (Philips Hue)
    # ShellyConnector  — pure httpx, no extra dep
    # HomeAssistantConnector — pure httpx, no extra dep
    "ring-doorbell>=0.8",      # RingConnector

    # ── Media consumer connectors ────────────────────────────────────────────
    "plexapi>=4.15",           # PlexConnector
    # CalibreConnector — subprocess calibredb, no extra dep
    # EmailConnector   — stdlib smtplib + imaplib, no extra dep

    # MCP 3.1 (Unified Gateway)
    "fastmcp>=3.4.4,<4",

    # Prefab UI (in-chat rich cards for list/status/stats tools)
    "prefab-ui>=0.14.0",

    # Observability (Prometheus /metrics for bridge)
    "prometheus-fastapi-instrumentator>=7.0",

    # ── Protocol Extensions ──────────────────────────────────────────────────
    "python-osc>=1.8.3",       # OSC council bridge & A/V gear

    # RAG (in-repo; no external docs_mcp)
    "lancedb>=0.4.0",
    "fastembed>=0.3.0",

    # Hand manifest (HAND.toml parsing)
    "tomli>=2.0",

    # Installer + skills (YAML manifests and skill configs)
    "pyyaml>=6.0",

    # Repo watcher (file watcher; used by tools/scripts)
    "requests>=2.28",
    "watchdog>=3.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",
    "httpx",
]
# Install everything including future connector deps
all = [
    "robofang[dev]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robofang = ["configs/*.json"]

[project.scripts]
robofang            = "robofang.cli:main"
robofang-bridge     = "robofang.main:main"
robofang-supervisor = "robofang.supervisor:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
timeout = 30
markers = [
    "github: marks tests that clone from GitHub (deselect with -m 'not github')",
    "integration: marks tests that need network or external services (deselect with -m 'not integration')",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S106"]
"tests/connectors/test_calibre.py" = ["S603"]
"scripts/cua-smoke.py" = ["S110", "S310", "S603", "S607", "E501"]
"scripts/*.py" = ["S110"]
"src/robofang/supervisor.py" = ["S603"]
"src/robofang/core/container_runtime.py" = ["S603"]
# Vetted subprocess calls to known binaries (git, uv, winget, docker) with
# controlled args — not untrusted input. The S603/S607 here are accepted.
"src/robofang/core/installer.py" = ["S603", "S607"]
"src/robofang/core/connectors/calibre.py" = ["S603"]
"src/robofang/cli.py" = ["S603"]
"src/robofang/app/fleet.py" = ["S603", "S607"]
"src/robofang/core/connectors/bridge.py" = ["S603"]
"src/robofang/core/external_registries.py" = ["S607"]
"src/robofang/core/heartbeat.py" = ["S603"]
"src/robofang/server_process.py" = ["S603"]
"tools/repo_stats.py" = ["S607"]
"tools/arxiv_rag_bridge.py" = ["S603"]
# Long-form markdown content embedded as a string literal (debate fixture).
"tools/finalize_round.py" = ["E501"]
"robofang-mcp/**/*.py" = ["E501"]
"robofang-mcp/src/robofang_mcp/**/*.py" = ["E501"]
"scratch_refactor.py" = ["E501", "E402"]
"scripts/council_benchmark.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.0,<0.17",
]
